server {
    listen 80;
    # Was a JS template literal that nobody ever substituted, so nginx took it as a
    # literal name and only answered because it is the single (= default) block.
    server_name _;
    root /usr/share/nginx/html;

    # Keep directory-index redirects relative: nginx only ever sees plain HTTP
    # behind Traefik and Cloudflare.
    absolute_redirect off;

    # No SPA fallback: this is a static multi-page site, and `/index.html` here
    # answered every typo with 200 + the start page.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Fingerprinted build assets never change under the same URL.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Thumbs and originals carry the generated ID in the filename.
    location /images/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Only fetched by the refresh button, and that appends ?t=<ms>.
    location = /images.json {
        add_header Cache-Control "no-store";
    }

    # Container healthcheck target (Dokploy).
    location = /health.html {
        add_header Cache-Control "no-store";
    }
}
