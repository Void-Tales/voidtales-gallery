name: Build Docker image and Deploy to Dokploy

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      FORCE_CACHE_INVALIDATE:
        description: 'Force cache invalidation'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-push-dockerfile-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Environment variables for remote file downloads
    env:
      EXT_DL_URL_MARKDOWN: ${{ secrets.EXT_DL_URL_MARKDOWN }}
      EXT_DL_URL_ORIGINAL: ${{ secrets.EXT_DL_URL_ORIGINAL }}
      EXT_DL_URL_MARKDOWN_EXTERNAL: ${{ secrets.EXT_DL_URL_MARKDOWN_EXTERNAL }}
      EXT_DL_URL_ORIGINAL_EXTERNAL: ${{ secrets.EXT_DL_URL_ORIGINAL_EXTERNAL }}
      FORCE_CACHE_INVALIDATE: ${{ github.event.inputs.FORCE_CACHE_INVALIDATE || 'false' }}

    environment:
      name: production
      url: https://gallery.voidtales.win/

    steps:
      # 📥 Checkout repository
      - name: 📥 Checkout repo
        uses: actions/checkout@v5

      # 🔧 Buildx, needed for the GHA layer cache backend below
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔧 Restore npm cache for cache key generation
      - name: 🔧 Restore npm cache for cache key generation
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cheerio-${{ hashFiles('scripts/get-cache-key.cjs') }}
          restore-keys: |
            ${{ runner.os }}-npm-cheerio-

      # 📦 Install dependencies for cache key generation
      - name: 📦 Install dependencies for cache key generation
        run: npm install cheerio
        shell: bash

      # 🔑 Generate dynamic cache key from remote files
      - name: 🔑 Generate dynamic cache key from remote files
        id: remote-key-gen
        run: node scripts/get-cache-key.cjs

      # 🗑️ Remove download markers before restoring cache
      - name: 🗑️ Remove download markers
        run: |
          rm -f src/content/photos/.downloads_synced
          rm -f public/images/original/.downloads_synced

      # 🔧 Restore downloaded files cache
      - name: 🔧 Restore downloaded files cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            src/content/photos
            public/images/original
          key: ${{ runner.os }}-downloads-${{ steps.remote-key-gen.outputs.cache-key }}-
          restore-keys: ${{ env.FORCE_CACHE_INVALIDATE == 'true' && '' || runner.os == 'Linux' && 'Linux-downloads-' || runner.os == 'Windows' && 'Windows-downloads-' || runner.os == 'macOS' && 'macOS-downloads-' }}

      # 📦 Install project dependencies
      - name: 📦 Install project dependencies
        run: |
          npm install -g pnpm@11.11.0
          pnpm install --frozen-lockfile

      # 📥 Download files if not cached
      - name: 📥 Download files (if not cached)
        run: |
          pnpm run copy:md-files
          pnpm run copy:original-images

      # 🗑️ Remove thumbnail marker before generating thumbnails
      - name: 🗑️ Remove thumbnail marker
        run: rm -f .thumbs_generated

      # 🔧 Restore thumbnail cache
      - name: 🔧 Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: public/images/thumbs
          key: thumbs-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'scripts/generate-thumbs.js', 'public/images/original/**') }}
          restore-keys: |
            thumbs-${{ runner.os }}-

      # 🖼️ Generate thumbnails if not cached
      - name: 🖼️ Generate thumbnails (if not cached)
        run: |
          mkdir -p public/images/thumbs
          pnpm run gen:thumbs

      # 💾 Save thumbnail cache after generation
      - name: 💾 Save thumbnails cache
        uses: actions/cache/save@v4
        with:
          path: public/images/thumbs
          key: thumbs-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'scripts/generate-thumbs.js', 'public/images/original/**') }}

      # 🔧 Log in to Docker Hub
      - name: 🔧 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔨 Build and push Docker image
      - name: 🔨 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # :latest is what Dokploy pulls; the SHA tag is the rollback target —
          # set it in Dokploy and redeploy to get back to a known good build.
          tags: |
            inventory69/voidtales-gallery:latest
            inventory69/voidtales-gallery:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            EXT_DL_URL_MARKDOWN=${{ env.EXT_DL_URL_MARKDOWN }}
            EXT_DL_URL_ORIGINAL=${{ env.EXT_DL_URL_ORIGINAL }}
            EXT_DL_URL_MARKDOWN_EXTERNAL=${{ env.EXT_DL_URL_MARKDOWN_EXTERNAL }}
            EXT_DL_URL_ORIGINAL_EXTERNAL=${{ env.EXT_DL_URL_ORIGINAL_EXTERNAL }}

      # 🚮 Purge images.json from Cloudflare cache
      - name: 🚮 Purge images.json from Cloudflare cache
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://gallery.voidtales.win/images.json"]}'

      # 🚀 Trigger Dokploy deployment
      # App-bound deploy webhook (Settings → General → Deployments in Dokploy):
      # no auth header, and it deploys exactly this one app — unlike the
      # instance-wide API token it replaces. Same pattern as the portal.
      # -fsS: without -f the run stays green even when Dokploy rejects the deploy.
      - name: 🚀 Trigger Dokploy Deployment
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" -d '{}' \
          "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}"