name: Build and deploy gallery-api

# Separate from deploy.yml on purpose: n8n dispatches deploy.yml for every new
# image, and that must not restart the API each time.

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          # package.json names pnpm, but the API needs no install at all.
          package-manager-cache: false
      - name: 🧪 node --test
        run: node --test api/server.test.js

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://gallery.voidtales.win/api/health
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🔧 Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest is what Dokploy pulls; the SHA tag is the rollback target.
      - name: 🔨 Build and push gallery-api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./api
          push: true
          tags: |
            inventory69/voidtales-gallery-api:latest
            inventory69/voidtales-gallery-api:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # Same rule as deploy.yml: anything but 200 is a failed deploy (a 3xx means an
      # edge swallowed the webhook).
      - name: 🚀 Trigger Dokploy deployment
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/dokploy.txt" -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" -d '{}' \
            "${{ secrets.DOKPLOY_API_DEPLOY_WEBHOOK }}")
          cat "$RUNNER_TEMP/dokploy.txt"; echo
          [ "$code" = "200" ] || {
            echo "::error::Dokploy answered $code - nothing was deployed"
            exit 1
          }
