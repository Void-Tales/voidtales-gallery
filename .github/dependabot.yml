# Weekly update PRs; nothing deploys until one is merged. Minor and patch come
# as one grouped PR, majors one PR each.
#
# cooldown: pnpm 11 refuses packages younger than a day (minimumReleaseAge), so
# a PR for a release from this morning would fail its own install. Security
# updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: "npm" # reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # @astrojs/check only accepts typescript ^5 || ^6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
